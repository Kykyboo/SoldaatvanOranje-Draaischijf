<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soldaat van Oranje - Draaischijf</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100vh; width: 100vw; overflow: hidden; background: #0f0f0f; color: #fff; display: flex; flex-direction: column; padding: 12px; }
        
        header { background: #1a1a1a; padding: 14px 18px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        header h1 { font-size: 1.1rem; font-weight: bold; }
        .live { color: #2ecc71; font-weight: bold; font-size: 0.9rem; background: rgba(46, 204, 113, 0.1); padding: 4px 10px; border-radius: 20px; }

        main { display: flex; flex-direction: column; gap: 10px; flex-grow: 1; overflow: hidden; }
        
        .section { background: #1a1a1a; padding: 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 8px; }
        .title { font-size: 0.75rem; color: #888; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        
        .cues-box { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .cues-grid { overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-right: 4px; }
        .cues-grid::-webkit-scrollbar { width: 6px; }
        .cues-grid::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        
        button { background: #2a2a2a; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; padding: 14px 8px; font-size: 0.9rem; transition: background 0.1s; }
        button:active { background: #e5a93b; color: #121212; }
        
        .cues-grid button { padding: 16px 4px; font-size: 0.85rem; background: #222; }
        
        .row { display: flex; gap: 8px; align-items: center; }
        .row button { flex: 1; }
        
        input { background: #2a2a2a; border: none; color: white; padding: 12px; border-radius: 8px; width: 100%; font-size: 1rem; outline: none; text-align: center; }
        input:focus { border: 1px solid #e5a93b; }
        
        .btn-gold { background: #e5a93b; color: #121212; font-weight: bold; }
        .btn-stop { background: #e74c3c; color: white; padding: 14px; font-size: 1rem; font-weight: bold; border-radius: 12px; width: 100%; border: none; cursor: pointer; }
        .btn-stop:active { filter: brightness(0.8); }

        @media (max-width: 600px) {
            .cues-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <header>
        <h1>⭐ Draaischijf Bediening</h1>
        <span class="live">● Verbonden</span>
    </header>

    <main>
        <!-- SCÈNES (CUES) -->
        <div class="section cues-box">
            <span class="title">Scènes (Klik om te draaien)</span>
            <div class="cues-grid">
                <button onclick="sendCue(1, 0)">1. Start</button>
                <button onclick="sendCue(2, 45)">2. Intro</button>
                <button onclick="sendCue(3, 180)">3. Stoel</button>
                <button onclick="sendCue(4, 270)">4. Versnel</button>
                <button onclick="sendCue(5, 90)">5. Outro</button>
                <button onclick="sendCue(6, 120)">6. Scene 6</button>
                <button onclick="sendCue(7, 150)">7. Scene 7</button>
                <button onclick="sendCue(8, 210)">8. Scene 8</button>
                <button onclick="sendCue(9, 240)">9. Scene 9</button>
                <button onclick="sendCue(10, 300)">10. Pauze</button>
                <button onclick="sendCue(11, 330)">11. Act 2</button>
                <button onclick="sendCue(12, 30)">12. Scene 12</button>
                <button onclick="sendCue(13, 60)">13. Scene 13</button>
                <button onclick="sendCue(14, 100)">14. Scene 14</button>
                <button onclick="sendCue(15, 135)">15. Scene 15</button>
                <button onclick="sendCue(16, 190)">16. Scene 16</button>
                <button onclick="sendCue(17, 220)">17. Scene 17</button>
                <button onclick="sendCue(18, 250)">18. Scene 18</button>
                <button onclick="sendCue(19, 310)">19. Finale</button>
                <button onclick="sendCue(20, 0)">20. Einde</button>
            </div>
        </div>

        <!-- VRIJ NAAR GRADEN -->
        <div class="section">
            <span class="title">Zelf een hoek kiezen</span>
            <div class="row">
                <input type="number" id="customAngle" placeholder="Aantal graden (bijv. 90)">
                <button class="btn-gold" onclick="sendCustomAngle()">Draai hierheen</button>
            </div>
        </div>

        <!-- KLEINE KNOPPEN: STAPPEN & RESET -->
        <div class="row">
            <button onclick="sendAction('manualM', {})">⟵ Stukje Links</button>
            <button onclick="sendAction('manualP', {})">Stukje Rechts ⟶</button>
        </div>

        <button class="btn-stop" onclick="sendAction('reset', {})">🛑 NOODSTOP / RESET</button>
    </main>

    <script>
        async function sendAction(action, extraData) {
            try {
                await fetch('/command-action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, ...extraData })
                });
            } catch (err) { console.error(err); }
        }

        function sendCue(index, angle) {
            // Vaste veilige standaardtijd van 14 seconden per knop
            sendAction('cue', { index: index, angle: angle, duration: 14 });
        }

        function sendCustomAngle() {
            const angle = parseFloat(document.getElementById('customAngle').value);
            if (isNaN(angle)) {
                alert('Vul eerst een getal in!');
                return;
            }
            sendAction('cue', { index: 0, angle: angle, duration: 14 });
        }
    </script>
</body>
</html>
