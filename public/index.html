<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soldaat van Oranje - Turntable Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; min-height: 100vh; display: flex; flex-direction: column; padding: 15px; max-width: 600px; margin: 0 auto; justify-content: space-between; }
        header { background: #1e1e1e; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        h2 { font-size: 1.1rem; margin-bottom: 12px; color: #ddd; }
        .grid-cues { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        button { background: #2d2d2d; color: white; border: 1px solid #444; padding: 16px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        button:active { background: #e5a93b; color: #121212; }
        .btn-reset { background: #cf6679; border: none; grid-column: span 2; color: #121212; }
        input { background: #2d2d2d; border: 1px solid #444; color: white; padding: 14px; border-radius: 6px; width: 100%; margin-bottom: 10px; font-size: 1rem; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .row button { flex: 1; }
        .label { font-size: 0.9rem; color: #aaa; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

    <header>
        <h1>⭐ Soldaat van Oranje</h1>
        <span style="color: #e5a93b; font-weight: bold;">● Online</span>
    </header>

    <main>
        <div class="card">
            <h2>Cues</h2>
            <div class="grid-cues">
                <button onclick="sendAction('cue', {index: 1})">Start</button>
                <button onclick="sendAction('cue', {index: 2})">Intro</button>
                <button onclick="sendAction('cue', {index: 3})">Stoel</button>
                <button onclick="sendAction('cue', {index: 4})">Versnel</button>
                <button onclick="sendAction('cue', {index: 5})">Outro</button>
                <button class="btn-reset" onclick="sendAction('reset', {})">RESET</button>
            </div>
        </div>

        <div class="card">
            <h2>Handmatig</h2>
            <span class="label">Draai hoek</span>
            <div class="row">
                <button onclick="sendAction('manualM', {})">-15°</button>
                <button onclick="sendAction('manualP', {})">+15°</button>
            </div>
        </div>

        <div class="card">
            <h2>Speler Volgen</h2>
            <input type="text" id="playerName" placeholder="Naam speler...">
            <div class="row">
                <button onclick="toggleTrack(true)" style="background: #e5a93b; color: #121212;">Start Volgen</button>
                <button onclick="toggleTrack(false)">Stop</button>
            </div>
        </div>
    </main>

    <script>
        fetch('/command').then(res => {
            if (res.status === 401) window.location.href = '/login.html';
        });

        async function sendAction(action, extraData) {
            try {
                const res = await fetch('/command-action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, ...extraData })
                });
                if (res.status === 401) window.location.href = '/login.html';
            } catch (err) {
                console.error(err);
            }
        }

        function toggleTrack(state) {
            const name = document.getElementById('playerName').value;
            if (state && !name) {
                alert('Vul eerst een naam in!');
                return;
            }
            sendAction('track', { state: state, playerName: name });
        }
    </script>
</body>
</html>
