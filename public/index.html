<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soldaat van Oranje - Draaischijf</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100vh; width: 100vw; overflow: hidden; background: #0f0f0f; color: #fff; display: flex; flex-direction: column; padding: 10px; }
        
        header { background: #1a1a1a; padding: 12px 16px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-shrink: 0; }
        header h1 { font-size: 1rem; font-weight: bold; }
        .live { color: #2ecc71; font-weight: bold; font-size: 0.85rem; background: rgba(46, 204, 113, 0.1); padding: 4px 10px; border-radius: 20px; }

        main { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; overflow-y: auto; padding-bottom: 10px; }
        main::-webkit-scrollbar { width: 6px; }
        main::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        
        .section { background: #1a1a1a; padding: 10px; border-radius: 10px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
        .title { font-size: 0.75rem; color: #888; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        
        .cues-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        
        button { background: #2a2a2a; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; padding: 12px 6px; font-size: 0.85rem; transition: background 0.1s; }
        button:active { background: #e5a93b; color: #121212; }
        
        .cues-grid button { padding: 14px 4px; font-size: 0.8rem; background: #222; }
        
        .row { display: flex; gap: 6px; align-items: center; }
        .row button { flex: 1; }
        
        input { background: #2a2a2a; border: none; color: white; padding: 10px; border-radius: 8px; width: 100%; font-size: 0.9rem; outline: none; text-align: center; }
        input:focus { border: 1px solid #e5a93b; }
        
        .btn-gold { background: #e5a93b; color: #121212; font-weight: bold; }
        .btn-gold:active { background: #c48e2b; }
        
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:active { background: #c0392b; }

        .btn-warning { background: #e67e22; color: white; }
        .btn-warning:active { background: #d35400; }

        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

        @media (max-width: 600px) {
            .cues-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <header>
        <h1>⭐ Draaischijf Bediening</h1>
        <span class="live">● Verbonden</span>
    </header>

    <main>
        <!-- 1. CUES -->
        <div class="section">
            <span class="title">1. Cues (Direct Klikken)</span>
            <div class="cues-grid">
                <button onclick="sendCue(1, 0)">1. Start</button>
                <button onclick="sendCue(2, 45)">2. Intro</button>
                <button onclick="sendCue(3, 180)">3. Stoel</button>
                <button onclick="sendCue(4, 270)">4. Versnel</button>
                <button onclick="sendCue(5, 90)">5. Outro</button>
                <button onclick="sendCue(6, 120)">6. Scene 6</button>
                <button onclick="sendCue(7, 150)">7. Scene 7</button>
                <button onclick="sendCue(8, 210)">8. Scene 8</button>
                <button onclick="sendCue(9, 240)">9. Scene 9</button>
                <button onclick="sendCue(10, 300)">10. Pauze</button>
                <button onclick="sendCue(11, 330)">11. Act 2</button>
                <button onclick="sendCue(12, 30)">12. Scene 12</button>
                <button onclick="sendCue(13, 60)">13. Scene 13</button>
                <button onclick="sendCue(14, 100)">14. Scene 14</button>
                <button onclick="sendCue(15, 135)">15. Scene 15</button>
                <button onclick="sendCue(16, 190)">16. Scene 16</button>
                <button onclick="sendCue(17, 220)">17. Scene 17</button>
                <button onclick="sendCue(18, 250)">18. Scene 18</button>
                <button onclick="sendCue(19, 310)">19. Finale</button>
                <button onclick="sendCue(20, 0)">20. Einde</button>
            </div>
        </div>

        <!-- 2. X AANTAL GRADEN DRAAIEN -->
        <div class="section">
            <span class="title">2. Naar X Aantal Graden Draaien</span>
            <div class="row">
                <input type="number" id="customAngle" placeholder="Aantal graden (bijv. 90)">
                <button class="btn-gold" onclick="sendCustomAngle()">Draai hierheen</button>
            </div>
        </div>

        <!-- 3. HANDMATIG DRAAIEN MET X SPEED (CONTINU) -->
        <div class="section">
            <span class="title">3. Handmatig Draaien (Continu met X Snelheid)</span>
            <div class="row">
                <input type="number" id="spinSpeed" placeholder="Snelheid (deg/s)" value="3">
                <button class="btn-gold" onclick="toggleSpin(true)">Start Snelheid</button>
                <button class="btn-danger" onclick="toggleSpin(false)">Stop Snelheid</button>
            </div>
        </div>

        <!-- 4. NOODSTOP EN RESET -->
        <div class="action-row">
            <button class="btn-danger" style="padding: 14px; font-size: 0.95rem;" onclick="sendAction('noodstop', {})">🛑 NOODSTOP</button>
            <button class="btn-warning" style="padding: 14px; font-size: 0.95rem;" onclick="sendAction('reset', {})">🔄 RESET SCHIJF</button>
        </div>
    </main>

    <script>
        async function sendAction(action, extraData) {
            try {
                await fetch('/command-action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, ...extraData })
                });
            } catch (err) { console.error(err); }
        }

        function sendCue(index, angle) {
            sendAction('cue', { index: index, angle: angle, duration: 14 });
        }

        function sendCustomAngle() {
            const angle = parseFloat(document.getElementById('customAngle').value);
            if (isNaN(angle)) {
                alert('Vul eerst een geldig getal in!');
                return;
            }
            sendAction('cue', { index: 0, angle: angle, duration: 14 });
        }

        function toggleSpin(state) {
            const speed = parseFloat(document.getElementById('spinSpeed').value) || 3;
            sendAction('spin', { state: state, speed: speed });
        }
    </script>
</body>
</html>
