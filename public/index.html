<!DOCTYPE html>
<html lang="nl" dir="ltr" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="https://cdn.discordapp.com/attachments/1517839791805300828/1546822057126404116/Logo_NB.png?ex=6aa12dcc&is=6a9fdc4c&hm=d03c93ba9e4a7f415ce7bca2566e5a3adbd8dc34851be30d9ab02d9a3f355636&" />
    <title>Soldaat van Oranje - Draaischijf Bediening</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.bunny.net/css?family=inter:400,500,600,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --font-family: 'Inter', sans-serif;
            --brand-color: #f49b3a;
            --brand-color-hover: #df8a28;
            --input-bg: rgba(18, 24, 33, 0.85);
            --input-border: rgba(44, 53, 67, 0.9);
            --card-bg: rgba(13, 19, 28, 0.92);
        }

        body {
            font-family: var(--font-family);
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.9), rgba(244, 155, 58, 0.1)), 
                        url("../assets/background.png") center/cover no-repeat fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            padding: 1.5rem 1rem;
            color: #fff;
        }

        .main-container {
            max-width: 1050px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .app-header {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-img {
            max-height: 42px;
            width: auto;
            object-fit: contain;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            letter-spacing: -0.3px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--brand-color);
        }

        .user-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e4e4e7;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.25);
            color: #fff;
        }

        .control-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            height: 100%;
        }

        .section-title {
            font-size: 0.75rem;
            color: #9ca3af;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.8px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cues-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn-cue {
            background: rgba(24, 32, 47, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #fff;
            border-radius: 10px;
            padding: 14px 12px;
            text-align: left;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            width: 100%;
        }

        .btn-cue:hover {
            background: rgba(40, 53, 76, 0.9);
            border-color: var(--brand-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(244, 155, 58, 0.15);
        }

        .btn-cue:active {
            transform: translateY(0);
        }

        .cue-number {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--brand-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cue-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #f3f4f6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .input-custom, .select-custom {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: white;
            padding: 10px 14px;
            border-radius: 9px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-custom:focus, .select-custom:focus {
            border-color: var(--brand-color);
            box-shadow: 0 0 0 3px rgba(244, 155, 58, 0.2);
            color: white;
        }

        .select-custom option {
            background-color: #121822;
            color: white;
        }

        .btn-brand {
            background-color: var(--brand-color);
            color: #121212;
            border: none;
            border-radius: 9px;
            padding: 10px 16px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 14px rgba(244, 155, 58, 0.25);
            transition: all 0.2s ease;
            cursor: pointer;
            width: 100%;
        }

        .btn-brand:hover {
            background-color: var(--brand-color-hover);
            transform: translateY(-1px);
        }

        .btn-danger-custom {
            background-color: #dc2626;
            color: white;
            border: none;
            border-radius: 9px;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .btn-danger-custom:hover {
            background-color: #ef4444;
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.3);
        }

        .btn-warning-custom {
            background-color: #d97706;
            color: white;
            border: none;
            border-radius: 9px;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .btn-warning-custom:hover {
            background-color: #f59e0b;
            box-shadow: 0 4px 14px rgba(217, 119, 6, 0.3);
        }

        /* Responsive optimalisaties */
        @media (max-width: 900px) {
            .cues-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .cues-grid { grid-template-columns: 1fr; }
            .user-name { display: none; }
        }
    </style>
</head>
<body>
    <script>
        if (!localStorage.getItem('isLoggedIn')) {
            window.location.href = '/login.html';
        }
    </script>

    <main class="main-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-brand">
                <img src="https://cdn.discordapp.com/attachments/1517839791805300828/1546822057126404116/Logo_NB.png?ex=6aa12dcc&is=6a9fdc4c&hm=d03c93ba9e4a7f415ce7bca2566e5a3adbd8dc34851be30d9ab02d9a3f355636&" alt="Logo" class="logo-img">
                <h1 class="header-title">Draaischijf Bediening</h1>
            </div>
            <div class="user-section">
                <img id="userAvatar" src="" alt="Avatar" class="user-avatar" style="display:none;">
                <span id="userName" class="user-name"></span>
                <button class="btn-logout" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Uitloggen
                </button>
            </div>
        </header>

        <!-- 1. Scène Cues -->
        <div class="control-card">
            <div class="section-title"><i class="bi bi-play-circle-fill text-warning"></i> 1. Scène Cues</div>
            <div class="cues-grid" id="cuesGrid"></div>
        </div>

        <!-- RIJ 2: Graden Draaien & Speler Volgen -->
        <div class="row g-3">
            <!-- Graden Draaien -->
            <div class="col-md-6">
                <div class="control-card">
                    <div class="section-title"><i class="bi bi-compass-fill text-warning"></i> 2. Graden Draaien</div>
                    <div class="d-flex flex-column gap-2">
                        <input type="number" step="any" id="customAngle" class="form-control input-custom" placeholder="Doel hoek (bijv. 90)">
                        <select id="customDirection" class="form-select select-custom">
                            <option value="rechts">Rechtsom (CW)</option>
                            <option value="links">Linksom (CCW)</option>
                        </select>
                        <button class="btn btn-brand mt-1" onclick="sendCustomAngle()">Draai naar Hoek</button>
                    </div>
                </div>
            </div>

            <!-- Roblox Speler Volgen -->
            <div class="col-md-6">
                <div class="control-card">
                    <div class="section-title"><i class="bi bi-person-fill text-warning"></i> 3. Roblox Speler Volgen Ingame</div>
                    <div class="d-flex flex-column gap-2">
                        <input type="text" id="robloxUsername" class="form-control input-custom" placeholder="Roblox gebruikersnaam">
                        <div class="d-flex gap-2 mt-1">
                            <button class="btn btn-brand flex-grow-1" onclick="startTracking()">Volg Starten</button>
                            <button class="btn btn-danger-custom flex-grow-1" onclick="stopTracking()">Stop</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. Handmatige Snelheid / Spin -->
        <div class="control-card">
            <div class="section-title"><i class="bi bi-arrow-repeat text-warning"></i> 4. Handmatige Snelheid (Spin)</div>
            <div class="row g-2 align-items-center">
                <div class="col-md-5">
                    <input type="number" id="spinSpeed" class="form-control input-custom" placeholder="Snelheid" value="3">
                </div>
                <div class="col-md-4">
                    <select id="spinDirection" class="form-select select-custom">
                        <option value="rechts">Rechtsom (CW)</option>
                        <option value="links">Linksom (CCW)</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button class="btn btn-brand flex-grow-1" onclick="toggleSpin(true)">Start</button>
                    <button class="btn btn-danger-custom flex-grow-1" onclick="toggleSpin(false)">Stop</button>
                </div>
            </div>
        </div>

        <!-- 5. Noodstop / Reset -->
        <div class="row g-2 pb-2">
            <div class="col">
                <button class="btn btn-danger-custom w-100 py-3" onclick="sendAction('noodstop', {})"><i class="bi bi-stop-fill"></i> NOODSTOP</button>
            </div>
            <div class="col">
                <button class="btn btn-warning-custom w-100 py-3" onclick="sendAction('reset', {})"><i class="bi bi-arrow-counterclockwise"></i> RESET (0°)</button>
            </div>
        </div>
    </main>

    <script>
        let currentAngle = 0;

        window.addEventListener('DOMContentLoaded', async () => {
            const name = localStorage.getItem('discordName');
            const avatar = localStorage.getItem('discordAvatar');
            if (name) document.getElementById('userName').innerText = name;
            if (avatar) {
                const img = document.getElementById('userAvatar');
                img.src = avatar;
                img.style.display = 'block';
            }
            await loadCues();
        });

        async function loadCues() {
            try {
                const response = await fetch('/config.json');
                const data = await response.json();
                renderCues(data.cues);
            } catch (err) { 
                console.error("Fout bij laden cues:", err); 
            }
        }

        function renderCues(cuesData) {
            const grid = document.getElementById('cuesGrid');
            grid.innerHTML = "";
            cuesData.forEach(cue => {
                const button = document.createElement('button');
                button.className = 'btn-cue';
                button.onclick = () => moveToAngle(cue.index, cue.angle, cue.duration || 14);
                button.innerHTML = `<span class="cue-number">Cue ${cue.index}</span><span class="cue-name">${cue.name}</span>`;
                grid.appendChild(button);
            });
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }

        async function sendAction(action, extraData = {}) {
            try {
                const payload = { action: action, data: extraData };
                console.log("📤 Verzenden naar server:", payload);

                const response = await fetch('/command-action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                console.log("📥 Server respons:", result);
            } catch (err) { 
                console.error("❌ Fout bij versturen actie:", err); 
            }
        }

        function moveToAngle(index, targetAngle, duration) {
            let currentMod = ((currentAngle % 360) + 360) % 360;
            let targetMod = ((targetAngle % 360) + 360) % 360;
            let diff = targetMod - currentMod;
            if (diff > 180) diff -= 360;
            else if (diff < -180) diff += 360;

            let direction = diff >= 0 ? 'rechts' : 'links';
            currentAngle = targetAngle;
            sendAction('cue', { index, angle: targetAngle, direction, duration });
        }

        function startTracking() {
            const username = document.getElementById('robloxUsername').value.trim();
            if (!username) {
                alert("Vul eerst een Roblox gebruikersnaam in!");
                return;
            }
            sendAction('follow_player', { username: username, state: true });
        }

        function stopTracking() {
            sendAction('follow_player', { state: false });
        }

        function sendCustomAngle() {
            const angle = parseFloat(document.getElementById('customAngle').value);
            const direction = document.getElementById('customDirection').value;
            if (!isNaN(angle)) {
                currentAngle = angle;
                sendAction('custom_angle', { index: 0, angle, direction, duration: 14 });
            }
        }

        function toggleSpin(state) {
            const speed = parseFloat(document.getElementById('spinSpeed').value) || 3;
            const direction = document.getElementById('spinDirection').value;
            sendAction('spin', { state, speed, direction });
        }
    </script>
</body>
</html>
