<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soldaat van Oranje - Turntable</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100vh; width: 100vw; overflow: hidden; background: #121212; color: #fff; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; }
        
        header { background: #1e1e1e; padding: 10px 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        header h1 { font-size: 1rem; }
        
        main { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; justify-content: center; }
        
        .card { background: #1e1e1e; padding: 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px; }
        .card-title { font-size: 0.8rem; color: #aaa; text-transform: uppercase; font-weight: bold; }
        
        .grid-cues { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .grid-cues button { padding: 12px 4px; font-size: 0.85rem; }
        
        button { background: #2d2d2d; color: white; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:active { background: #e5a93b; color: #121212; }
        
        .row { display: flex; gap: 6px; }
        .row button { flex: 1; padding: 12px; font-size: 0.9rem; }
        
        input { background: #2d2d2d; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; width: 100%; font-size: 0.9rem; outline: none; }
        input:focus { border-color: #e5a93b; }
        
        .btn-reset { background: #cf6679; border: none; color: #121212; padding: 10px; font-size: 0.85rem; }
        
        footer { font-size: 0.75rem; text-align: center; color: #666; flex-shrink: 0; padding-top: 2px; }
    </style>
</head>
<body>

    <header>
        <h1>⭐ Soldaat van Oranje</h1>
        <span style="color: #e5a93b; font-weight: bold; font-size: 0.85rem;">● Online</span>
    </header>

    <main>
        <!-- Cues in 1 rij -->
        <div class="card">
            <span class="card-title">Scènes</span>
            <div class="grid-cues">
                <button onclick="sendAction('cue', {index: 1})">Start</button>
                <button onclick="sendAction('cue', {index: 2})">Intro</button>
                <button onclick="sendAction('cue', {index: 3})">Stoel</button>
                <button onclick="sendAction('cue', {index: 4})">Versnel</button>
                <button onclick="sendAction('cue', {index: 5})">Outro</button>
            </div>
        </div>

        <!-- Handmatig -->
        <div class="card">
            <span class="card-title">Handmatig (15°)</span>
            <div class="row">
                <button onclick="sendAction('manualM', {})">← Links</button>
                <button onclick="sendAction('manualP', {})">Rechts →</button>
            </div>
        </div>

        <!-- Speler Volgen -->
        <div class="card">
            <span class="card-title">Speler Volgen</span>
            <input type="text" id="playerName" placeholder="Naam speler...">
            <div class="row">
                <button onclick="toggleTrack(true)" style="background: #e5a93b; color: #121212;">Start</button>
                <button onclick="toggleTrack(false)">Stop</button>
            </div>
        </div>

        <!-- Reset -->
        <button class="btn-reset" onclick="sendAction('reset', {})">NOODSTOP / RESET</button>
    </main>

    <footer>Turntable Control</footer>

    <script>
        fetch('/command').then(res => {
            if (res.status === 401) window.location.href = '/login.html';
        });

        async function sendAction(action, extraData) {
            try {
                const res = await fetch('/command-action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, ...extraData })
                });
                if (res.status === 401) window.location.href = '/login.html';
            } catch (err) {
                console.error(err);
            }
        }

        function toggleTrack(state) {
            const name = document.getElementById('playerName').value;
            if (state && !name) {
                alert('Vul eerst een naam in!');
                return;
            }
            sendAction('track', { state: state, playerName: name });
        }
    </script>
</body>
</html>
