<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inloggen - Soldaat van Oranje</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #121212; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            padding: 20px;
        }

        .box { 
            background: #1e1e1e; 
            padding: 40px 30px; 
            border-radius: 12px; 
            text-align: center; 
            width: 100%; 
            max-width: 380px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: -5px;
        }

        h2 { 
            font-size: 1.3rem; 
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        p { 
            color: #aaa; 
            font-size: 0.95rem; 
            line-height: 1.4;
            margin-bottom: 5px;
        }

        .btn-discord { 
            background: #5865F2; 
            color: white; 
            padding: 14px 20px; 
            text-decoration: none; 
            border-radius: 8px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            font-weight: bold; 
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.3);
        }

        .btn-discord:hover { 
            background: #4752c4; 
        }

        .btn-discord:active {
            transform: scale(0.98);
        }

        .btn-discord svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">⭐</div>
        <h2>Soldaat van Oranje</h2>
        <p>Log in met je Discord-account om toegang te krijgen tot de draaiplateau besturing.</p>
        
        <a href="/auth/discord" class="btn-discord">
            <svg viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.68,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.15c2.65-27.28-4.51-51.1-19.45-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.44-12.72S96.15,46,96.13,53,91,65.69,84.69,65.69Z"/>
            </svg>
            Inloggen met Discord
        </a>
    </div>
</body>
</html>
